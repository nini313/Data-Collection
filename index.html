<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錄製平台</title>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .video-container {
            position: relative; /* 讓計時標籤能相對於此區域定位 */
            flex: 1;
            padding: 10px;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            background-color: #000;
        }
        /* 錄影計時標籤：移至畫面正上方置中 */
        .timer-badge {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%); /* 水平置中 */
            background-color: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: monospace;
            align-items: center;
            gap: 8px;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        /* 紅點閃爍動畫 */
        .record-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        .buttons {
            text-align: center;
            margin-top: 20px;
        }
        /* 容器設置16:9比例，寬高比例 = 874:492 */
        .film-container {
            position: relative;
            width: 100%;
            max-width: 874px;
            margin: auto;
        }
        /* 嵌入影片 iframe 設置 */
        .film-container iframe {
            width: 100%;
            height: 492px;
        }
        /* 問題顯示的 overlay */
        .overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px;
            font-size: 30px;
            text-align: center;
            border-radius: 30px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <h1>錄製平台</h1>
    <div class="container">
        <div class="video-container">
            <h2>即時相機畫面</h2>
            <!-- 置中的錄製計時標籤 -->
            <div id="timerBadge" class="timer-badge">
                <span class="record-dot"></span>
                <span id="timerText">REC 00:00</span>
            </div>
            <video id="video" autoplay playsinline muted></video>
        </div>
        <div class="video-container">
            <h2>錄影結果</h2>
            <video id="recordedVideo" controls></video>
        </div>
    </div>
    <div class="buttons">
        <button id="startRecording">開始錄影</button>
        <button id="stopRecording" disabled>停止錄影</button>
        <a id="downloadRecording" href="#" download="recording.mp4">
            <button disabled>下載錄影</button>
        </a>
    </div>

    <h2>YouTube 影片</h2>
    <div class="film-container">
        <iframe
            src="https://www.youtube.com/embed/68a98R1V18g" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <div id="overlay" class="overlay"></div>
    
    <script>
        const videoElement = document.getElementById("video");
        const recordedVideo = document.getElementById("recordedVideo");
        const startButton = document.getElementById("startRecording");
        const stopButton = document.getElementById("stopRecording");
        const downloadButton = document.getElementById("downloadRecording");
        const overlay = document.getElementById("overlay");
        const timerBadge = document.getElementById("timerBadge");
        const timerText = document.getElementById("timerText");

        let mediaRecorder;
        let recordedChunks = [];
        let recordingTimer;
        let questionTimers = [];
        let selectedMimeType = "";
        let fileExtension = "mp4";
        const maxRecordingTime = 10 * 60 * 1000;

        // 計時器變數
        let timerInterval = null;
        let startTime = 0;

        const questions = [
            { time: 3 * 60 * 1000, text: "Q1：請分享你今天遇到什麼開心的事情？" },
            { time: 5 * 60 * 1000, text: "Q2：最近讓你感動的事是什麼？" },
            { time: 8 * 60 * 1000, text: "Q3：你對未來有什麼規劃？" }
        ];

        // 格式化秒數為 mm:ss (超過 1 小時則為 hh:mm:ss)
        function formatDuration(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            const pad = (num) => String(num).padStart(2, "0");

            if (hrs > 0) {
                return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            }
            return `${pad(mins)}:${pad(secs)}`;
        }

        function startRecordingTimer() {
            startTime = Date.now();
            timerText.textContent = "REC 00:00";
            timerBadge.style.display = "inline-flex";

            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                timerText.textContent = `REC ${formatDuration(elapsedSeconds)}`;
            }, 1000);
        }
