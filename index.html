<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>說話平台</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 20px;
        }
        .video-container {
            position: relative;
            flex: 1;
            padding: 10px;
            box-sizing: border-box;
            background: #f4f4f4;
            border-radius: 8px;
        }
        video {
            width: 100%;
            height: auto;
            max-width: 1280px;
            max-height: 720px;
            background-color: #000;
            border-radius: 6px;
            display: block;
        }
        /* 錄製計時標籤 */
        .timer-badge {
            display: none;
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: monospace;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        /* 錄影紅點閃爍效果 */
        .record-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        .buttons {
            text-align: center;
            margin: 20px 0;
        }
        .buttons button {
            padding: 8px 18px;
            font-size: 16px;
            margin: 0 6px;
            cursor: pointer;
        }
        /* 容器設置 16:9 比例 */
        .film-container {
            position: relative;
            width: 100%;
            max-width: 874px;
            margin: auto;
        }
        .film-container iframe {
            width: 100%;
            height: 492px;
            border: none;
            border-radius: 8px;
        }
        /* 問題顯示的 overlay */
        .overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 30px;
            font-size: 26px;
            text-align: center;
            border-radius: 16px;
            display: none;
            z-index: 1000;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <h1>說話平台</h1>
    <div class="container">
        <div class="video-container">
            <h2>即時相機畫面</h2>
            <div id="timerBadge" class="timer-badge">
                <span class="record-dot"></span>
                <span id="timerText">REC 00:00</span>
            </div>
            <video id="video" autoplay playsinline muted></video>
        </div>
        <div class="video-container">
            <h2>錄影結果</h2>
            <video id="recordedVideo" controls></video>
        </div>
    </div>

    <div class="buttons">
        <button id="startRecording">開始錄影</button>
        <button id="stopRecording" disabled>停止錄影</button>
        <a id="downloadRecording" href="#" download="recording.mp4">
            <button disabled>下載錄影</button>
        </a>
    </div>

    <h2>YouTube 影片</h2>
    <div class="film-container">
        <iframe
            src="https://www.youtube.com/embed/68a98R1V18g" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <div id="overlay" class="overlay"></div>

    <script>
        const videoElement = document.getElementById("video");
        const recordedVideo = document.getElementById("recordedVideo");
        const startButton = document.getElementById("startRecording");
        const stopButton = document.getElementById("stopRecording");
        const downloadButton = document.getElementById("downloadRecording");
        const overlay = document.getElementById("overlay");
        const timerBadge = document.getElementById("timerBadge");
        const timerText = document.getElementById("timerText");

        let mediaRecorder;
        let recordedChunks = [];
        let recordingTimeout;
        let questionTimers = [];
        let selectedMimeType = "";
        let fileExtension = "mp4";
        const maxRecordingTime = 10 * 60 * 1000;

        // 計時器變數
        let timerInterval = null;
        let startTime = 0;

        const questions = [
            { time: 3 * 60 * 1000, text: "Q1：請分享你今天遇到什麼開心的事情？" },
            { time: 5 * 60 * 1000, text: "Q2：最近讓你感動的事是什麼？" },
            { time: 8 * 60 * 1000, text: "Q3：你對未來有什麼規劃？" }
        ];

        // 格式化秒數為 mm:ss (若超過一小時則為 hh:mm:ss)
        function formatDuration(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            const pad = (num) => String(num).padStart(2, "0");
            if (hrs > 0) {
                return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            }
            return `${pad(mins)}:${pad(secs)}`;
        }

        function startTimer() {
            startTime = Date.now();
            timerBadge.style.display = "flex";
            timerText.textContent = "REC 00:00";

            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                timerText.textContent = `REC ${formatDuration(elapsedSeconds)}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timerBadge.style.display = "none";
        }

        // 偵測支援的 MP4 格式，若不支援則降級至 WebM
        function getSupportedMimeType() {
            const types = [
                "video/mp4;codecs=avc1,mp4a.40.2",
                "video/mp4;codecs=h264",
                "video/mp4",
                "video/webm;codecs=vp9,opus",
                "video/webm;codecs=vp8,opus",
                "video/webm"
            ];

            for (const type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    return type;
                }
            }
            return "";
        }

        function showQuestion(question) {
            overlay.textContent = question.text;
            overlay.style.display = "block";

            setTimeout(() => {
                overlay.style.display = "none";
            }, 15000);
        }

                });
